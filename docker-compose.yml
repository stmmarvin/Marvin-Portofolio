services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marvin-portfolio-web
    restart: unless-stopped
    environment:
      DB_HOST: mysql
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: MarvinPortofolio
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/MarvinPortofolio.sql:/docker-entrypoint-initdb.d/MarvinPortofolio.sql:ro

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
    ports:
      - "8080:80"
    depends_on:
      - mysql

volumes:
  mysql_data: